name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Hard gates — these must pass.
      - name: Typecheck
        run: npx tsc --noEmit

      # Runs the suite and enforces the coverage ratchet in vitest.config.ts.
      # The thresholds sit just under current coverage, so this fails only if
      # coverage goes backwards.
      - name: Test + coverage ratchet
        run: npm run test:coverage

      # Was non-blocking while the repo carried ~1.3k lint errors. That debt is
      # paid off — `npm run lint` now reports nothing — so this is a hard gate
      # again; letting it slide is how it accumulated the first time.
      - name: Lint
        run: npm run lint

      - name: Build
        # No secrets needed: Supabase/JWT are resolved lazily and the app is
        # build-safe without env (see lib/supabase/client.ts, lib/auth.ts).
        run: npm run build
        env:
          NODE_ENV: production

  # End-to-end smoke tests: a production build against a LOCAL Supabase stack
  # (Docker on the runner, migrations applied by the CLI). The OpenAI key is
  # deliberately invalid, so nothing here can reach production or spend money.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Write e2e env
        run: npm run e2e:env

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
