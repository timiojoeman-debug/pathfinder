name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Hard gates — these must pass.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      # Non-blocking for now: the repo carries pre-existing lint debt
      # (~1.3k errors in legacy modules). Surface it without failing the
      # build; paying it down is tracked as Phase-1 tech debt.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build
        # No secrets needed: Supabase/JWT are resolved lazily and the app is
        # build-safe without env (see lib/supabase/client.ts, lib/auth.ts).
        run: npm run build
        env:
          NODE_ENV: production
