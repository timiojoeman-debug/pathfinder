name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Hard gates — these must pass.
      - name: Typecheck
        run: npx tsc --noEmit

      # Runs the suite and enforces the coverage ratchet in vitest.config.ts.
      # The thresholds sit just under current coverage, so this fails only if
      # coverage goes backwards.
      - name: Test + coverage ratchet
        run: npm run test:coverage

      # Was non-blocking while the repo carried ~1.3k lint errors. That debt is
      # paid off — `npm run lint` now reports nothing — so this is a hard gate
      # again; letting it slide is how it accumulated the first time.
      - name: Lint
        run: npm run lint

      - name: Build
        # No secrets needed: Supabase/JWT are resolved lazily and the app is
        # build-safe without env (see lib/supabase/client.ts, lib/auth.ts).
        run: npm run build
        env:
          NODE_ENV: production

  # End-to-end smoke tests: a production build against a LOCAL Supabase stack
  # (Docker on the runner, migrations applied by the CLI). The OpenAI key is
  # deliberately invalid, so nothing here can reach production or spend money.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The Supabase images come from public.ecr.aws, which throttles anonymous
      # pulls from shared runners ("toomanyrequests: Rate exceeded"). Cache them
      # so most runs never touch the registry, keyed on the CLI version (lockfile)
      # and the service set (config + the db:start exclusions in package.json).
      - name: Restore Supabase images
        id: sb-images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'supabase/config.toml') }}

      - name: Load Supabase images
        if: steps.sb-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-images.tar

      # On a cache miss the pull can still be throttled; back off and retry.
      - name: Start local Supabase
        run: |
          for i in 1 2 3 4; do
            npm run db:start && exit 0
            echo "db:start attempt $i failed; retrying in $((i * 45))s"
            npx supabase stop --no-backup || true
            sleep $((i * 45))
          done
          exit 1

      - name: Save Supabase images
        if: steps.sb-images.outputs.cache-hit != 'true'
        run: docker save -o /tmp/supabase-images.tar $(docker images --format '{{.Repository}}:{{.Tag}}' | grep supabase)

      - name: Write e2e env
        run: npm run e2e:env

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
