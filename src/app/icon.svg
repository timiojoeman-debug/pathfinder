<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PathFinder">
  <!-- Favicon: white P on the site's amber, with the arrow as negative space.
       The amber tile is the app accent; the P is the on-accent cream; the bowl's
       counter is a right-pointing arrow (progress/"find") that shows the tile
       gradient straight through via a userSpaceOnUse gradient — a true knockout,
       no mask. Reads as a clear arrow to ~32px and a clean P at 16px. -->
  <defs>
    <linearGradient id="pf-amber" x1="8" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E7A860"/><stop offset="1" stop-color="#B0673C"/>
    </linearGradient>
    <linearGradient id="pf-rim" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#pf-amber)"/>
  <rect x="18" y="15" width="9" height="34" rx="2.5" fill="#F7F1E4"/>
  <path d="M27 15 h9 a12.5 12.5 0 0 1 0 25 h-9 z" fill="#F7F1E4"/>
  <path d="M27 21.5 h6 l5.5 6 l-5.5 6 h-6 z" fill="url(#pf-amber)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="14.4" fill="none" stroke="url(#pf-rim)"/>
</svg>
