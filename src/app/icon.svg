<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PathFinder">
  <!-- Favicon: the PathFinder mark reduced to its simplest form. The amber bowl
       is "the path" forming the P; its counter is a right-pointing arrow (the
       big logo's motion, expressed as negative space) that survives to ~32px and
       harmlessly reads as a plain P at 16px. Warm-paper palette: cream stem,
       amber bowl, warm-brown tile — matched to pf-theme.css, not the pure-black
       brand board. -->
  <rect width="64" height="64" rx="15" fill="#2B2115"/>
  <rect x="18" y="15" width="9" height="34" rx="2.5" fill="#F7F1E4"/>
  <path d="M27 15 h9 a12.5 12.5 0 0 1 0 25 h-9 z" fill="#D2894C"/>
  <path d="M27 22 h6 l5 5.5 l-5 5.5 h-6 z" fill="#2B2115"/>
</svg>
